<svg width="960" height="480" viewBox="0 0 960 480" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="heroTitle">
  <title id="heroTitle">Illustration of a guest scanning a table QR code, with the order appearing live on a kitchen screen</title>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="960" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#eff8fd"/>
      <stop offset="1" stop-color="#dceffb"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f7f7f7"/>
    </linearGradient>
  </defs>

  <rect width="960" height="480" rx="24" fill="url(#bgGrad)"/>

  <!-- table -->
  <ellipse cx="230" cy="380" rx="190" ry="26" fill="#1b75a6" opacity="0.08"/>

  <!-- phone with QR -->
  <g>
    <rect x="120" y="120" width="180" height="300" rx="28" fill="#232f3f"/>
    <rect x="132" y="150" width="156" height="240" rx="10" fill="url(#cardGrad)"/>
    <rect x="152" y="172" width="116" height="116" rx="8" fill="#ffffff" stroke="#1e90cc" stroke-width="3"/>
    <g fill="#1b2a3a">
      <rect x="164" y="184" width="20" height="20" rx="2"/>
      <rect x="232" y="184" width="20" height="20" rx="2"/>
      <rect x="164" y="252" width="20" height="20" rx="2"/>
      <rect x="198" y="218" width="16" height="16" rx="2"/>
      <rect x="228" y="252" width="24" height="10" rx="2"/>
      <rect x="228" y="266" width="10" height="10" rx="2"/>
    </g>
    <rect x="152" y="308" width="116" height="10" rx="5" fill="#dceffb"/>
    <rect x="152" y="326" width="80" height="10" rx="5" fill="#dceffb"/>
    <rect x="152" y="360" width="116" height="22" rx="11" fill="#2da8e5"/>
  </g>

  <!-- dotted path -->
  <path d="M310 260 C 420 200, 520 200, 610 240" stroke="#2da8e5" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round" fill="none"/>

  <!-- notification bubble mid-path -->
  <g transform="translate(430,160)">
    <rect x="0" y="0" width="120" height="46" rx="14" fill="#ffffff" stroke="#e5e7eb"/>
    <circle cx="22" cy="23" r="10" fill="#2da8e5"/>
    <path d="M18 23 l3 3 l7 -7" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <rect x="42" y="14" width="62" height="7" rx="3.5" fill="#232f3f" opacity="0.8"/>
    <rect x="42" y="26" width="44" height="6" rx="3" fill="#9aa4b2"/>
  </g>

  <!-- kitchen / staff screen -->
  <g>
    <rect x="620" y="90" width="280" height="320" rx="20" fill="#232f3f"/>
    <rect x="640" y="118" width="240" height="264" rx="10" fill="url(#cardGrad)"/>

    <rect x="656" y="134" width="90" height="10" rx="5" fill="#232f3f" opacity="0.85"/>
    <circle cx="855" cy="140" r="9" fill="#2da8e5"/>

    <g>
      <rect x="656" y="160" width="208" height="62" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
      <rect x="668" y="172" width="54" height="8" rx="4" fill="#232f3f" opacity="0.85"/>
      <rect x="668" y="186" width="90" height="6" rx="3" fill="#9aa4b2"/>
      <rect x="668" y="200" width="70" height="14" rx="7" fill="#2da8e5"/>
      <rect x="796" y="172" width="42" height="14" rx="7" fill="#dceffb"/>
    </g>

    <g>
      <rect x="656" y="232" width="208" height="62" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
      <rect x="668" y="244" width="54" height="8" rx="4" fill="#232f3f" opacity="0.85"/>
      <rect x="668" y="258" width="90" height="6" rx="3" fill="#9aa4b2"/>
      <rect x="668" y="272" width="70" height="14" rx="7" fill="#e5e7eb"/>
      <rect x="796" y="244" width="42" height="14" rx="7" fill="#dceffb"/>
    </g>

    <g>
      <rect x="656" y="304" width="208" height="62" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
      <rect x="668" y="316" width="54" height="8" rx="4" fill="#232f3f" opacity="0.85"/>
      <rect x="668" y="330" width="90" height="6" rx="3" fill="#9aa4b2"/>
      <rect x="668" y="344" width="70" height="14" rx="7" fill="#e5e7eb"/>
      <rect x="796" y="316" width="42" height="14" rx="7" fill="#dceffb"/>
    </g>
  </g>

  <!-- decorative dots -->
  <circle cx="90" cy="90" r="5" fill="#2da8e5" opacity="0.5"/>
  <circle cx="900" cy="60" r="4" fill="#1e90cc" opacity="0.4"/>
  <circle cx="560" cy="420" r="5" fill="#2da8e5" opacity="0.35"/>
</svg>
