services:
  frontend:
    build:
      context: .
      args:
        NEXT_PUBLIC_PUSHER_KEY: ${NEXT_PUBLIC_PUSHER_KEY:-}
        NEXT_PUBLIC_PUSHER_CLUSTER: ${NEXT_PUBLIC_PUSHER_CLUSTER:-}
    image: crm-frontend
    ports:
      - "3001:3001"
    env_file: .env.production.local
    environment:
      # The backend running on the host machine; override for other setups.
      API_URL: ${API_URL:-http://host.docker.internal:3000}
    restart: unless-stopped
